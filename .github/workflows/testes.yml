name: Testes
on:
  push:
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Motor de cálculo
        run: node tests/engine.test.cjs
      - name: Instalar Playwright
        run: npm install --no-save playwright@1.56.0 && npx playwright install --with-deps chromium
      - name: Interface
        run: node tests/ui.test.cjs
